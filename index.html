<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约书架文件管理器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg: #f6f1e8;
            --surface: #fffaf1;
            --surface-strong: #f0e5d0;
            --ink: #28231d;
            --muted: #7b6e61;
            --line: #d8c7ad;
            --wood: #b07a4c;
            --wood-dark: #7b4d2c;
            --accent: #8f5f35;
            --accent-strong: #5d3d22;
            --shadow: 0 24px 70px rgba(89, 62, 35, 0.18);
            --radius: 28px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 34rem),
                linear-gradient(135deg, #fbf6ed 0%, var(--bg) 48%, #efe3cf 100%);
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 42px 0 56px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 28px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .intro,
        .search-panel {
            border: 1px solid rgba(139, 96, 55, 0.16);
            border-radius: var(--radius);
            background: rgba(255, 250, 241, 0.82);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .intro {
            padding: 34px;
        }

        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            margin: 0 0 16px;
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--accent-strong);
            background: #efe0c9;
            font-size: 13px;
            letter-spacing: 0.06em;
        }

        h1 {
            margin: 0;
            max-width: 760px;
            font-size: clamp(34px, 6vw, 72px);
            line-height: 0.96;
            letter-spacing: -0.08em;
        }

        .subtitle {
            margin: 18px 0 0;
            max-width: 650px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.8;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
        }

        .stat {
            min-width: 116px;
            padding: 14px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.56);
            border: 1px solid rgba(151, 113, 73, 0.16);
        }

        .stat strong {
            display: block;
            font-size: 22px;
        }

        .stat span {
            color: var(--muted);
            font-size: 13px;
        }

        .search-panel {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .search-title h2,
        .reader-side h3 {
            margin: 0;
            font-size: 18px;
        }

        .index-badge {
            padding: 6px 10px;
            border-radius: 999px;
            color: var(--accent-strong);
            background: #ead8bd;
            font-size: 12px;
            white-space: nowrap;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 15px 16px 15px 44px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.72);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(143, 95, 53, 0.14);
        }

        .input-wrap::before {
            content: "⌕";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 22px;
        }

        .search-hint {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .matches {
            display: grid;
            gap: 10px;
            max-height: 240px;
            overflow: auto;
            padding-right: 4px;
        }

        .match {
            border: 1px solid rgba(139, 96, 55, 0.15);
            border-radius: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.55);
        }

        .match button {
            border: 0;
            padding: 0;
            color: var(--accent-strong);
            background: transparent;
            font-weight: 700;
            text-align: left;
        }

        .match p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        mark {
            padding: 0 2px;
            border-radius: 4px;
            color: inherit;
            background: #f5d98f;
        }

        .library {
            position: relative;
            border-radius: var(--radius);
            padding: 28px 28px 34px;
            background: rgba(255, 250, 241, 0.72);
            border: 1px solid rgba(139, 96, 55, 0.14);
            box-shadow: var(--shadow);
        }

        .library-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 20px;
        }

        .library-head h2 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -0.03em;
        }

        .library-head p {
            margin: 7px 0 0;
            color: var(--muted);
        }

        .shelf {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            gap: 28px;
            align-items: end;
            min-height: 410px;
            padding: 42px 28px 68px;
            border-radius: 26px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.46), transparent 52%),
                linear-gradient(90deg, rgba(136, 88, 45, 0.14), transparent 15%, transparent 85%, rgba(136, 88, 45, 0.14)),
                #efe0c9;
        }

        .shelf::before,
        .shelf::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 34px;
            height: 22px;
            background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
            box-shadow: 0 18px 28px rgba(82, 49, 24, 0.24);
        }

        .shelf::after {
            bottom: 13px;
            height: 16px;
            background: #6f4326;
            opacity: 0.88;
        }

        .book {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 290px;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .book.is-hidden {
            pointer-events: none;
            opacity: 0.18;
            transform: translateY(8px) scale(0.96);
            filter: grayscale(0.8);
        }

        .book-cover {
            width: min(172px, 100%);
            min-height: 258px;
            border: 0;
            border-radius: 10px 16px 16px 10px;
            padding: 22px 18px;
            color: #fffaf1;
            text-align: left;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent 18%),
                var(--cover, #8f5f35);
            box-shadow:
                inset 10px 0 18px rgba(0, 0, 0, 0.18),
                inset -1px 0 0 rgba(255, 255, 255, 0.3),
                0 22px 24px rgba(69, 42, 22, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-cover:hover,
        .book-cover:focus-visible {
            outline: none;
            transform: translateY(-12px) rotate(-1.5deg);
            box-shadow:
                inset 10px 0 18px rgba(0, 0, 0, 0.18),
                inset -1px 0 0 rgba(255, 255, 255, 0.3),
                0 34px 34px rgba(69, 42, 22, 0.25);
        }

        .book-cover small {
            display: block;
            margin-bottom: 20px;
            opacity: 0.78;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .book-cover strong {
            display: block;
            font-size: 22px;
            line-height: 1.18;
            letter-spacing: -0.04em;
        }

        .book-cover span {
            display: block;
            margin-top: 18px;
            color: rgba(255, 250, 241, 0.78);
            font-size: 13px;
            line-height: 1.6;
        }

        .book-action {
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            border: 0;
            border-radius: 999px;
            padding: 9px 14px;
            color: var(--accent-strong);
            background: #fff8eb;
            box-shadow: 0 10px 20px rgba(71, 45, 20, 0.16);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease, bottom 0.2s ease;
        }

        .book:hover .book-action,
        .book:focus-within .book-action {
            bottom: -8px;
            opacity: 1;
        }

        .empty {
            position: absolute;
            z-index: 2;
            inset: 0;
            display: none;
            place-items: center;
            color: var(--muted);
            text-align: center;
            pointer-events: none;
        }

        .empty.is-visible {
            display: grid;
        }

        .reader {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            padding: 22px;
            background: rgba(50, 38, 28, 0.32);
            backdrop-filter: blur(18px);
        }

        .reader.is-open {
            display: grid;
            place-items: center;
        }

        .reader-shell {
            width: min(1220px, 100%);
            height: min(820px, calc(100vh - 44px));
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            border-radius: 30px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: 0 38px 90px rgba(33, 24, 16, 0.34);
            transform-origin: center bottom;
        }

        .reader.is-open .reader-shell {
            animation: zoomIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.72) translateY(56px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .reader-main {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            min-width: 0;
            min-height: 0;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.9), transparent 22rem),
                #efe3cf;
        }

        .reader-toolbar,
        .reader-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-color: rgba(128, 91, 55, 0.14);
        }

        .reader-toolbar {
            border-bottom: 1px solid rgba(128, 91, 55, 0.14);
        }

        .reader-controls {
            border-top: 1px solid rgba(128, 91, 55, 0.14);
        }

        .reader-name {
            min-width: 0;
        }

        .reader-name h2 {
            margin: 0;
            overflow: hidden;
            font-size: 20px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-name p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .icon-btn,
        .page-btn,
        .open-pdf {
            border: 1px solid rgba(128, 91, 55, 0.18);
            border-radius: 999px;
            color: var(--accent-strong);
            background: rgba(255, 250, 241, 0.78);
            text-decoration: none;
            transition: transform 0.16s ease, background 0.16s ease;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
        }

        .page-btn,
        .open-pdf {
            padding: 11px 16px;
        }

        .icon-btn:hover,
        .page-btn:hover,
        .open-pdf:hover {
            transform: translateY(-1px);
            background: #fff;
        }

        .page-btn:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            transform: none;
        }

        .page-stage {
            display: grid;
            place-items: center;
            min-height: 0;
            padding: 26px;
            perspective: 1800px;
            overflow: hidden;
        }

        .page-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
        }

        .page-shadow {
            position: absolute;
            inset: 7% 16%;
            border-radius: 36px;
            background: rgba(72, 45, 22, 0.13);
            filter: blur(22px);
        }

        #pdfCanvas {
            position: relative;
            z-index: 1;
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            background: white;
            box-shadow: 0 22px 45px rgba(55, 35, 18, 0.24);
            transform-origin: left center;
        }

        #pdfCanvas.flip-forward {
            animation: flipForward 0.68s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #pdfCanvas.flip-back {
            transform-origin: right center;
            animation: flipBack 0.68s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes flipForward {
            from {
                opacity: 0.16;
                transform: rotateY(-78deg) translateX(42px) scale(0.96);
                filter: brightness(0.84) drop-shadow(-26px 14px 18px rgba(63, 40, 20, 0.28));
            }
            to {
                opacity: 1;
                transform: rotateY(0) translateX(0);
                filter: brightness(1) drop-shadow(0 0 0 rgba(63, 40, 20, 0));
            }
        }

        @keyframes flipBack {
            from {
                opacity: 0.16;
                transform: rotateY(78deg) translateX(-42px) scale(0.96);
                filter: brightness(0.84) drop-shadow(26px 14px 18px rgba(63, 40, 20, 0.28));
            }
            to {
                opacity: 1;
                transform: rotateY(0) translateX(0);
                filter: brightness(1) drop-shadow(0 0 0 rgba(63, 40, 20, 0));
            }
        }

        .loading {
            position: absolute;
            z-index: 2;
            display: none;
            padding: 12px 16px;
            border-radius: 999px;
            color: var(--accent-strong);
            background: rgba(255, 250, 241, 0.9);
            box-shadow: 0 12px 24px rgba(55, 35, 18, 0.16);
        }

        .loading.is-visible {
            display: block;
        }

        .page-indicator {
            color: var(--muted);
            font-weight: 700;
        }

        .reader-side {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
            min-height: 0;
            padding: 22px;
            border-left: 1px solid rgba(128, 91, 55, 0.14);
            overflow: hidden;
            background: #fff8eb;
        }

        .meta-card {
            padding: 16px;
            border: 1px solid rgba(128, 91, 55, 0.14);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.64);
        }

        .meta-card p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .reader-results {
            display: grid;
            gap: 9px;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            padding-right: 3px;
        }

        .reader-result {
            border: 1px solid rgba(128, 91, 55, 0.14);
            border-radius: 16px;
            padding: 11px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.68);
            text-align: left;
        }

        .reader-result strong {
            display: block;
            margin-bottom: 4px;
            color: var(--accent-strong);
        }

        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 40;
            max-width: 360px;
            border-radius: 18px;
            padding: 14px 16px;
            color: #fff8eb;
            background: rgba(71, 45, 20, 0.92);
            box-shadow: 0 18px 32px rgba(33, 24, 16, 0.2);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 980px) {
            .hero,
            .reader-shell {
                grid-template-columns: 1fr;
            }

            .reader-shell {
                height: calc(100vh - 26px);
            }

            .reader-side {
                min-height: 230px;
                border-left: 0;
                border-top: 1px solid rgba(128, 91, 55, 0.14);
            }

            .shelf {
                grid-template-columns: repeat(2, minmax(150px, 1fr));
            }
        }

        @media (max-width: 640px) {
            .app {
                width: min(100% - 24px, 1180px);
                padding-top: 18px;
            }

            .intro,
            .search-panel,
            .library {
                border-radius: 22px;
                padding: 20px;
            }

            .library-head {
                display: block;
            }

            .shelf {
                grid-template-columns: 1fr;
                padding-inline: 18px;
            }

            .reader {
                padding: 10px;
            }

            .reader-toolbar,
            .reader-controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="hero">
            <div class="intro">
                <p class="eyebrow">PDF FILE SHELF</p>
                <h1>星域双引擎闭合模式内部资料</h1>
                <p class="subtitle">双击书本打开文件，阅读时有放大入场和翻页动画。系统会在后台为 PDF 建立全文索引，支持跨文件搜索和当前文件内搜索。</p>
                <div class="stats" aria-label="文件统计">
                    <div class="stat">
                        <strong>4</strong>
                        <span>份 PDF 文件</span>
                    </div>
                    <div class="stat">
                        <strong>2250</strong>
                        <span>页内容</span>
                    </div>
                    <div class="stat">
                        <strong>全文</strong>
                        <span>浏览器内搜索</span>
                    </div>
                </div>
            </div>

            <aside class="search-panel" aria-label="文件搜索">
                <div class="search-title">
                    <h2>搜索文件内容</h2>
                    <span id="indexStatus" class="index-badge">准备索引</span>
                </div>
                <label class="input-wrap">
                    <span class="sr-only">输入关键词搜索所有文件</span>
                    <input id="librarySearch" type="search" placeholder="例如：OpenClaw、财务、提示词" autocomplete="off">
                </label>
                <p class="search-hint">搜索会匹配文件名、简介和已索引 PDF 正文；点击结果可直接打开对应文件。</p>
                <div id="globalMatches" class="matches" aria-live="polite"></div>
            </aside>
        </section>

        <section class="library">
            <div class="library-head">
                <div>
                    <h2>主书架</h2>
                    <p>将鼠标移到书本上，双击封面即可打开。</p>
                </div>
                <a class="open-pdf" href="#shelf">查看全部文件</a>
            </div>
            <div id="shelf" class="shelf" aria-label="文件书架"></div>
            <div id="emptyState" class="empty">没有找到匹配的文件</div>
        </section>
    </main>

    <section id="reader" class="reader" role="dialog" aria-modal="true" aria-label="文件阅读器">
        <div class="reader-shell">
            <div class="reader-main">
                <header class="reader-toolbar">
                    <div class="reader-name">
                        <h2 id="readerTitle">文件</h2>
                        <p id="readerSubtitle">PDF</p>
                    </div>
                    <button id="closeReader" class="icon-btn" type="button" aria-label="关闭阅读器">×</button>
                </header>

                <div class="page-stage">
                    <div class="page-wrap">
                        <div class="page-shadow" aria-hidden="true"></div>
                        <canvas id="pdfCanvas" aria-label="PDF 页面"></canvas>
                        <div id="loading" class="loading">正在加载页面...</div>
                    </div>
                </div>

                <footer class="reader-controls">
                    <button id="prevPage" class="page-btn" type="button">上一页</button>
                    <span id="pageIndicator" class="page-indicator">第 1 / 1 页</span>
                    <button id="nextPage" class="page-btn" type="button">下一页</button>
                </footer>
            </div>

            <aside class="reader-side">
                <div class="meta-card">
                    <h3>文件信息</h3>
                    <p id="readerSummary"></p>
                    <p><a id="rawPdfLink" class="open-pdf" href="#" target="_blank" rel="noreferrer">打开原始 PDF</a></p>
                </div>
                <div>
                    <h3>在当前文件中搜索</h3>
                    <label class="input-wrap">
                        <span class="sr-only">输入关键词搜索当前文件</span>
                        <input id="readerSearch" type="search" placeholder="搜索当前文件内容" autocomplete="off">
                    </label>
                </div>
                <div id="readerResults" class="reader-results" aria-live="polite"></div>
            </aside>
        </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const FILES = [
            {
                id: "prompt-guide",
                title: "把话说对，AI 就会做事",
                subtitle: "普通人的提示词指南",
                author: "童俊翔",
                pages: 148,
                path: "assets/pdfs/prompt-guide.pdf",
                cover: "#8f5f35",
                summary: "讲解提示词基础语法、普通人常用 AI 场景、提示词模板和表达方法。"
            },
            {
                id: "openclaw-errors",
                title: "OpenClaw 常见报错与修复指南",
                subtitle: "企业内部排错手册",
                author: "童俊翔",
                pages: 700,
                path: "assets/pdfs/openclaw-errors.pdf",
                cover: "#5e6f50",
                summary: "覆盖 OpenClaw 安装、启动、网关、认证、模型调用、渠道消息和权限插件问题。"
            },
            {
                id: "ai-finance",
                title: "AI 财务革命",
                subtitle: "从手工对账到智能财务系统",
                author: "童俊翔",
                pages: 244,
                path: "assets/pdfs/ai-finance.pdf",
                cover: "#775c9c",
                summary: "围绕 AI 自动记账、对账、财务分析、税务、知识库、Agent 和老板驾驶舱。"
            },
            {
                id: "openclaw-trade",
                title: "让客户主动下单",
                subtitle: "AI 时代的 OpenClaw 外贸客户开发实战",
                author: "童俊翔 & Grey Smith",
                pages: 1158,
                path: "assets/pdfs/openclaw-trade.pdf",
                cover: "#2f6f7c",
                summary: "介绍 OpenClaw 外贸销售工作台、客户搜索、联系人挖掘、开发信、报价谈判和成交跟进。"
            }
        ];

        const state = {
            currentFile: null,
            currentPdf: null,
            currentPage: 1,
            pageCount: 1,
            renderTask: null,
            renderId: 0,
            indexes: new Map(),
            pdfCache: new Map(),
            indexedCount: 0
        };

        const el = {
            shelf: document.getElementById("shelf"),
            emptyState: document.getElementById("emptyState"),
            librarySearch: document.getElementById("librarySearch"),
            globalMatches: document.getElementById("globalMatches"),
            indexStatus: document.getElementById("indexStatus"),
            reader: document.getElementById("reader"),
            closeReader: document.getElementById("closeReader"),
            readerTitle: document.getElementById("readerTitle"),
            readerSubtitle: document.getElementById("readerSubtitle"),
            readerSummary: document.getElementById("readerSummary"),
            rawPdfLink: document.getElementById("rawPdfLink"),
            pdfCanvas: document.getElementById("pdfCanvas"),
            loading: document.getElementById("loading"),
            prevPage: document.getElementById("prevPage"),
            nextPage: document.getElementById("nextPage"),
            pageIndicator: document.getElementById("pageIndicator"),
            readerSearch: document.getElementById("readerSearch"),
            readerResults: document.getElementById("readerResults"),
            toast: document.getElementById("toast")
        };

        const hasPdfEngine = Boolean(window.pdfjsLib);
        if (hasPdfEngine) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }

        function normalize(value) {
            return String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function highlight(value, query) {
            const safe = escapeHtml(value);
            const normalizedQuery = normalize(query);
            if (!normalizedQuery) return safe;
            const tokens = normalizedQuery.split(" ").filter(Boolean).slice(0, 4);
            return tokens.reduce((html, token) => {
                const escapedToken = token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                return html.replace(new RegExp(escapedToken, "gi"), match => `<mark>${match}</mark>`);
            }, safe);
        }

        function createSnippet(text, query) {
            const source = normalize(text);
            const target = normalize(query).split(" ").find(Boolean);
            if (!source || !target) return "";
            const index = source.indexOf(target);
            if (index < 0) return "";
            const start = Math.max(0, index - 42);
            const end = Math.min(source.length, index + target.length + 72);
            const prefix = start > 0 ? "..." : "";
            const suffix = end < source.length ? "..." : "";
            return `${prefix}${source.slice(start, end)}${suffix}`;
        }

        function showToast(message) {
            el.toast.textContent = message;
            el.toast.classList.add("is-visible");
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => el.toast.classList.remove("is-visible"), 2400);
        }

        function renderShelf() {
            el.shelf.innerHTML = FILES.map(file => `
                <article class="book" data-id="${file.id}">
                    <button class="book-cover" type="button" style="--cover: ${file.cover}" aria-label="双击打开 ${escapeHtml(file.title)}">
                        <small>${file.pages} 页 · PDF</small>
                        <strong>${escapeHtml(file.title)}</strong>
                        <span>${escapeHtml(file.subtitle)}</span>
                    </button>
                    <button class="book-action" type="button">双击打开</button>
                </article>
            `).join("");

            el.shelf.querySelectorAll(".book").forEach(book => {
                const file = FILES.find(item => item.id === book.dataset.id);
                const open = () => openReader(file);
                book.querySelector(".book-cover").addEventListener("dblclick", open);
                book.querySelector(".book-cover").addEventListener("keydown", event => {
                    if (event.key === "Enter") open();
                });
                book.querySelector(".book-action").addEventListener("dblclick", open);
            });
        }

        async function getPdf(file) {
            if (!hasPdfEngine) {
                throw new Error("PDF 引擎未加载，请检查网络后刷新页面。");
            }
            if (!state.pdfCache.has(file.id)) {
                state.pdfCache.set(file.id, pdfjsLib.getDocument(file.path).promise);
            }
            return state.pdfCache.get(file.id);
        }

        async function buildIndexes() {
            if (!hasPdfEngine) {
                el.indexStatus.textContent = "索引不可用";
                showToast("PDF.js 未加载，无法建立全文索引。");
                return;
            }

            for (const file of FILES) {
                el.indexStatus.textContent = `索引 ${state.indexedCount + 1}/${FILES.length}`;
                try {
                    const pdf = await getPdf(file);
                    const pages = [];
                    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                        const page = await pdf.getPage(pageNumber);
                        const content = await page.getTextContent();
                        const text = content.items.map(item => item.str).join(" ");
                        pages.push({ page: pageNumber, text });
                    }
                    state.indexes.set(file.id, {
                        pages,
                        text: pages.map(page => page.text).join(" ")
                    });
                } catch (error) {
                    console.error(error);
                    state.indexes.set(file.id, { pages: [], text: "" });
                }
                state.indexedCount += 1;
                updateIndexStatus();
                runGlobalSearch();
            }
        }

        function updateIndexStatus() {
            const done = state.indexedCount === FILES.length;
            el.indexStatus.textContent = done ? "全文索引完成" : `已索引 ${state.indexedCount}/${FILES.length}`;
        }

        function runGlobalSearch() {
            const query = el.librarySearch.value;
            const normalizedQuery = normalize(query);
            let visibleCount = 0;
            const matches = [];

            FILES.forEach(file => {
                const index = state.indexes.get(file.id);
                const haystack = normalize(`${file.title} ${file.subtitle} ${file.summary} ${index?.text || ""}`);
                const isVisible = !normalizedQuery || normalizedQuery.split(" ").every(token => haystack.includes(token));
                const book = el.shelf.querySelector(`[data-id="${file.id}"]`);
                book?.classList.toggle("is-hidden", !isVisible);
                if (isVisible) visibleCount += 1;

                if (normalizedQuery && isVisible) {
                    const snippetSource = createSnippet(index?.text || `${file.summary} ${file.subtitle}`, normalizedQuery) || file.summary;
                    matches.push({ file, snippet: snippetSource });
                }
            });

            el.emptyState.classList.toggle("is-visible", visibleCount === 0);

            if (!normalizedQuery) {
                el.globalMatches.innerHTML = "";
                return;
            }

            el.globalMatches.innerHTML = matches.length
                ? matches.map(({ file, snippet }) => `
                    <div class="match">
                        <button type="button" data-open="${file.id}">${highlight(file.title, query)}</button>
                        <p>${highlight(snippet, query)}</p>
                    </div>
                `).join("")
                : `<div class="match"><p>没有匹配内容。若索引仍在进行中，请稍等片刻。</p></div>`;

            el.globalMatches.querySelectorAll("[data-open]").forEach(button => {
                const file = FILES.find(item => item.id === button.dataset.open);
                button.addEventListener("click", () => openReader(file));
            });
        }

        async function openReader(file, pageNumber = 1) {
            if (!file) return;
            state.currentFile = file;
            state.currentPage = pageNumber;
            state.currentPdf = null;
            state.pageCount = file.pages;
            el.readerTitle.textContent = file.title;
            el.readerSubtitle.textContent = `${file.subtitle} · ${file.author}`;
            el.readerSummary.textContent = file.summary;
            el.rawPdfLink.href = file.path;
            el.readerSearch.value = "";
            el.readerResults.innerHTML = `<button class="reader-result" type="button">输入关键词后，可跳到匹配页面。</button>`;
            el.reader.classList.add("is-open");
            document.body.style.overflow = "hidden";
            showLoading(true);

            try {
                const pdf = await getPdf(file);
                state.currentPdf = pdf;
                state.pageCount = pdf.numPages;
                await renderPage(pageNumber, "next");
                updatePageControls();
            } catch (error) {
                console.error(error);
                showToast(error.message || "文件加载失败。");
                showLoading(false);
            }
        }

        function closeReader() {
            el.reader.classList.remove("is-open");
            document.body.style.overflow = "";
            state.currentFile = null;
            state.currentPdf = null;
            if (state.renderTask) {
                state.renderTask.cancel();
                state.renderTask = null;
            }
        }

        function showLoading(visible) {
            el.loading.classList.toggle("is-visible", visible);
        }

        async function renderPage(pageNumber, direction = "next") {
            if (!state.currentPdf) return;
            const renderId = state.renderId + 1;
            state.renderId = renderId;
            const nextPage = Math.min(Math.max(pageNumber, 1), state.pageCount);
            state.currentPage = nextPage;
            showLoading(true);

            if (state.renderTask) {
                state.renderTask.cancel();
                state.renderTask = null;
            }

            const page = await state.currentPdf.getPage(nextPage);
            const container = document.querySelector(".page-stage");
            const rawViewport = page.getViewport({ scale: 1 });
            const availableWidth = Math.max(260, container.clientWidth - 56);
            const availableHeight = Math.max(260, container.clientHeight - 56);
            const scale = Math.min(availableWidth / rawViewport.width, availableHeight / rawViewport.height, 1.55);
            const viewport = page.getViewport({ scale });
            const outputScale = window.devicePixelRatio || 1;
            const tempCanvas = document.createElement("canvas");
            const tempContext = tempCanvas.getContext("2d");
            const canvas = el.pdfCanvas;
            const context = canvas.getContext("2d");

            tempCanvas.width = Math.floor(viewport.width * outputScale);
            tempCanvas.height = Math.floor(viewport.height * outputScale);

            const task = page.render({
                canvasContext: tempContext,
                viewport,
                transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
            });
            state.renderTask = task;

            try {
                await task.promise;
                if (renderId !== state.renderId) return;
                canvas.width = tempCanvas.width;
                canvas.height = tempCanvas.height;
                canvas.style.width = `${Math.floor(viewport.width)}px`;
                canvas.style.height = `${Math.floor(viewport.height)}px`;
                context.setTransform(1, 0, 0, 1, 0, 0);
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(tempCanvas, 0, 0);
            } catch (error) {
                if (error?.name !== "RenderingCancelledException") throw error;
            } finally {
                if (state.renderTask === task) {
                    state.renderTask = null;
                }
                if (renderId === state.renderId) {
                    showLoading(false);
                }
            }

            if (renderId !== state.renderId) return;
            canvas.classList.remove("flip-forward", "flip-back");
            void canvas.offsetWidth;
            canvas.classList.add(direction === "prev" ? "flip-back" : "flip-forward");
            updatePageControls();
        }

        function updatePageControls() {
            el.pageIndicator.textContent = `第 ${state.currentPage} / ${state.pageCount} 页`;
            el.prevPage.disabled = state.currentPage <= 1;
            el.nextPage.disabled = state.currentPage >= state.pageCount;
        }

        function searchCurrentFile() {
            const file = state.currentFile;
            const query = el.readerSearch.value;
            const normalizedQuery = normalize(query);
            if (!file || !normalizedQuery) {
                el.readerResults.innerHTML = `<button class="reader-result" type="button">输入关键词后，可跳到匹配页面。</button>`;
                return;
            }

            const index = state.indexes.get(file.id);
            if (!index || !index.pages.length) {
                el.readerResults.innerHTML = `<button class="reader-result" type="button">当前文件仍在索引中，请稍后再试。</button>`;
                return;
            }

            const tokens = normalizedQuery.split(" ").filter(Boolean);
            const results = index.pages
                .filter(page => tokens.every(token => normalize(page.text).includes(token)))
                .slice(0, 24)
                .map(page => ({
                    page: page.page,
                    snippet: createSnippet(page.text, normalizedQuery) || page.text.slice(0, 90)
                }));

            el.readerResults.innerHTML = results.length
                ? results.map(result => `
                    <button class="reader-result" type="button" data-page="${result.page}">
                        <strong>第 ${result.page} 页</strong>
                        ${highlight(result.snippet, query)}
                    </button>
                `).join("")
                : `<button class="reader-result" type="button">未找到匹配内容。</button>`;

            el.readerResults.querySelectorAll("[data-page]").forEach(button => {
                button.addEventListener("click", () => renderPage(Number(button.dataset.page), Number(button.dataset.page) > state.currentPage ? "next" : "prev"));
            });
        }

        function bindEvents() {
            el.librarySearch.addEventListener("input", runGlobalSearch);
            el.readerSearch.addEventListener("input", searchCurrentFile);
            el.closeReader.addEventListener("click", closeReader);
            el.prevPage.addEventListener("click", () => renderPage(state.currentPage - 1, "prev"));
            el.nextPage.addEventListener("click", () => renderPage(state.currentPage + 1, "next"));
            el.reader.addEventListener("click", event => {
                if (event.target === el.reader) closeReader();
            });
            window.addEventListener("keydown", event => {
                if (!el.reader.classList.contains("is-open")) return;
                if (event.key === "Escape") closeReader();
                if (event.key === "ArrowLeft") renderPage(state.currentPage - 1, "prev");
                if (event.key === "ArrowRight") renderPage(state.currentPage + 1, "next");
            });
            window.addEventListener("resize", () => {
                if (state.currentPdf) renderPage(state.currentPage, "next");
            });
        }

        renderShelf();
        bindEvents();
        updateIndexStatus();
        buildIndexes();
    </script>
</body>
</html>
