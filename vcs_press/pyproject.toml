[tool.black]
line-length = 140
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 140
known_first_party = ["app"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = false
check_untyped_defs = false
exclude = ["data/"]
