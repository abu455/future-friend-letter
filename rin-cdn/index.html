<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIN Desktop</title><style>html,body{margin:0;height:100%;background:#09090d;color:#fff;font-family:system-ui}#loading{height:100%;display:grid;place-items:center;text-align:center}.dot{width:10px;height:10px;border-radius:50%;background:#ff5b9f;display:inline-block;box-shadow:0 0 18px #ff5b9f;margin-right:8px}button{border:0;border-radius:10px;padding:10px 14px;background:#ff5b9f;color:#fff}</style></head><body><div id="loading"><div><div><span class="dot"></span>正在载入 RIN 电脑完整版…</div><p style="color:#999;font-size:13px">首次打开需要下载角色动画资源</p></div></div><script>(async()=>{try{const u='./chunk-00.txt?v='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('CDN '+r.status);const b=(await r.text()).trim();const bin=atob(b);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><h2>RIN 加载失败</h2><p>'+String(e)+'</p><button onclick="location.reload()">重新加载</button></div>'}})();</script></body></html>
